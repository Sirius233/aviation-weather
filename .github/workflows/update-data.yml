name: Update METAR data
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch METAR/TAF data
        run: |
          mkdir -p data
          ICAOS="ZBAA ZBAD ZBTJ ZBSJ ZBYN ZBDT ZBYC ZBHH ZBOW ZBCF ZBDS ZBTL ZBXL ZBLA ZBUL ZYTX ZYTL ZYCC ZYHB ZYYJ ZYMD ZYQQ ZYJM ZYHE ZYDD ZYJZ ZYCY ZSPD ZSSS ZSNJ ZSHC ZSWX ZSCG ZSNT ZSYA ZSXZ ZSLG ZSYN ZSNB ZSWZ ZSZS ZSLQ ZSYW ZSOF ZSFY ZSFZ ZSAM ZSQZ ZSWY ZSJN ZSQD ZSYT ZSWH ZSLY ZSJG ZSDY ZSWF ZSCN ZSGZ ZSGS ZSJD ZSYC ZSJJ ZHHH ZHYC ZHXF ZHSN ZHSY ZHCC ZHLY ZHNY ZGHA ZGDY ZGCD ZGGG ZGSZ ZGSD ZGOW ZGZJ ZGMX ZGNN ZGKL ZGZH ZGBH ZGWZ ZJHK ZJSY ZJQH ZUUU ZUTF ZUCK ZUWX ZUQJ ZPPP ZPLX ZPDL ZPJH ZPDQ ZPMS ZPNL ZUGY ZULS ZUNZ ZUBD ZUAL ZURK ZUMY ZUYB ZULZ ZUJZ ZUZH ZUNC ZUXC ZUDX ZLXY ZLYL ZLSN ZLLL ZLDH ZLJQ ZLXN ZLGL ZLIC ZWWW ZWSH ZWTN ZWAK ZWKL ZWKC ZWYN ZWKM ZWHM ZWAT ZWTK ZWTL WSSS VTBS RJTT RKSI WMKP"
          curl -s "https://aviationweather.gov/api/data/metar?ids=${ICAOS}&taf=true&format=raw" -o data/metar.txt
          # Convert to JS data file using python3 (robust JSON escaping)
          python3 -c "
import json
with open('data/metar.txt', 'r', encoding='utf-8') as f:
    content = f.read()
with open('data/metar.js', 'w', encoding='utf-8') as f:
    f.write('window.METAR_DATA = ' + json.dumps(content) + ';\n')
"
          echo "Generated $(wc -c < data/metar.js) bytes"
      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data/metar.txt data/metar.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update METAR/TAF data"
            git push
          fi
